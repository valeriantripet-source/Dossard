<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Dossard</title>
<meta name="description" content="Le Dossard, carnet d’entraînement au trail : un objectif, des étapes, un rythme, et une médaille à chaque arrivée.">
<meta name="theme-color" content="#3B6CB0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Le Dossard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icones/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<style>
/* Polices Barlow servies par le site lui-même (dossier polices/), sans appel à un autre serveur. */
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(polices/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(polices/barlow-500.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(polices/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(polices/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(polices/barlow-condensed-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(polices/barlow-condensed-800.woff2) format('woff2')}
</style>
<style>
:root{
  /* Mise en page : une colonne de téléphone (480 px au plus), un bandeau bleu en tête de chaque écran,
     le dossard comme pièce centrale de l'accueil, une barre de six onglets fixée en bas. Thème clair unique. */
  --fond:#F4F4F1;
  --carte:#FFFFFF;
  --encre:#101418;
  --gris:#4A5057;
  --trait:#D9DAD5;
  --bleu:#3B6CB0;
  --orange:#F26B1D;
  --alerte:#A3261B;
  --platine:#EAEFF3;
  --bronze:#C98852;
  --argent:#C6CBD1;
  --or:#F2C230;
  --titre:'Barlow Condensed','Arial Narrow',sans-serif;
  --texte:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E2E3DD;color:var(--encre);font-family:var(--texte);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body.fige{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,fieldset{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.bandeau :focus-visible,.bravo :focus-visible{outline-color:#FFFFFF}
.cache{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.app{max-width:480px;min-height:100%;margin:0 auto;background:var(--fond);display:flex;flex-direction:column}
main{flex:1;padding-bottom:96px;outline:none}

/* Étiquettes et titres */
.sur{font:600 14px/18px var(--titre);letter-spacing:.1em;text-transform:uppercase}
.sur.gris{font-size:13px;line-height:16px;color:var(--gris)}
.geant{font:800 56px/.95 var(--titre);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.petit{font-size:13px;line-height:18px;font-weight:500}
.aide{font-size:13px;line-height:18px;color:var(--gris)}
.erreur{font-size:14px;line-height:19px;font-weight:600;color:var(--alerte)}

/* Bandeau */
.bandeau{background:var(--bleu);color:#FFFFFF;padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px}
.bandeau p{font-size:14px;line-height:19px;font-weight:500}
.rang{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rond{flex:none;width:44px;height:44px;margin:-10px -10px -10px 0;border:0;border-radius:50%;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* Dossard */
.dossard{align-self:center;width:min(318px,100%);margin:6px 0 10px;background:#FFFFFF;color:var(--encre);border-radius:10px;box-shadow:6px 8px 0 rgba(16,20,24,.3);transform:rotate(-2deg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.dossard-haut{min-height:34px;padding:6px 26px;background:var(--orange);display:flex;align-items:center;justify-content:center;text-align:center;font:700 15px/1.2 var(--titre);letter-spacing:.1em;text-transform:uppercase}
.dossard-num{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:10px 12px 6px;font-family:var(--titre);font-weight:800}
.dossard-num .num{font-size:128px;line-height:.86}
.dossard-num .num.m{font-size:108px}
.dossard-num .num.l{font-size:92px}
.dossard-num .unite{font-size:40px;line-height:1}
.dossard-num .unite.d{font-size:30px}
.dossard-bas{min-height:46px;border-top:2px solid var(--encre);padding:6px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--titre)}
.dossard-bas .nom{font-weight:800;font-size:28px;line-height:1;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.jmoins{flex:none;background:var(--encre);color:#FFFFFF;padding:3px 10px;font:700 20px/24px var(--titre);letter-spacing:.04em;white-space:nowrap}
.trou{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--bleu)}
.trou.a{left:10px;top:12px}.trou.b{right:10px;top:12px}.trou.c{left:10px;bottom:18px}.trou.e{right:10px;bottom:18px}

.prepa{display:flex;flex-direction:column;gap:6px}
.segments{display:grid;gap:4px}
.segments i{height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.segments i.fait{background:#FFFFFF}
.segments i.ici{background:var(--orange)}

/* Corps */
.bloc{padding:20px 20px 0;display:flex;flex-direction:column;gap:14px}
.bloc.serre{gap:0}
.carte{display:flex;flex-direction:column;gap:8px}
.titre-seance{font:800 34px/36px var(--titre);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.resume{font-size:14px;line-height:19px;color:#2B3036;text-wrap:pretty}
.faits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.fait{border-top:3px solid var(--encre);padding-top:5px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.fait b{font:800 30px/32px var(--titre)}
.fait span{font:700 14px/16px var(--titre);letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.actions>*{flex:1 1 200px}

/* Boutons */
.btn{min-height:52px;padding:0 18px;border:0;border-radius:8px;background:var(--encre);color:#FFFFFF;font:700 20px var(--titre);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn.sec{background:transparent;color:var(--encre);border:2px solid var(--encre)}
.btn.petit{min-height:44px;font-size:16px}
.btn.clair{background:#FFFFFF;color:var(--encre)}
.lien{min-height:44px;padding:0 2px;border:0;background:none;color:var(--bleu);font:700 14px var(--titre);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;text-align:left}
.lien.danger{color:var(--alerte)}

/* Porte-médailles */
.ratelier{display:flex;flex-direction:column;gap:8px;color:inherit;text-decoration:none;margin-top:8px}
.barre{height:4px;border-radius:2px;background:var(--encre)}
.medailles{display:flex;justify-content:space-between;padding:0 8px;margin-top:-8px}
.med{display:flex;flex-direction:column;align-items:center;flex:none}
.ruban{width:14px;height:24px;background:#DADBD6}
.disque{margin-top:-3px;width:40px;height:40px;border-radius:50%;border:2px dashed #9A9D98;background:var(--fond);color:#5B5F5A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 17px/1 var(--titre)}
.med.d .disque{font-size:14px}
.med.gagnee .ruban{background:linear-gradient(90deg,var(--bleu) 0%,var(--bleu) 34%,#FFFFFF 34%,#FFFFFF 66%,var(--bleu) 66%,var(--bleu) 100%)}
.med.gagnee .disque{border:2px solid var(--encre);background:var(--orange);color:var(--encre)}
.med.cours .ruban{background:#FFFFFF;border:1.5px solid var(--bleu);border-top:0}
.med.cours .disque{border:2px solid var(--bleu);background:#FFFFFF;color:var(--bleu)}
/* Médailles bonus : une icône dans le disque. Évolutives : ruban sombre, disque bronze, argent ou or.
   Uniques : ruban orange, disque sombre. Le palier se lit aussi dans le texte et sur la piste, jamais par la couleur seule. */
.med.bonus .disque svg{display:block}
.med.bonus.bronze .ruban,.med.bonus.argent .ruban,.med.bonus.or .ruban{background:var(--encre)}
.med.bonus.bronze .disque,.med.bonus.argent .disque,.med.bonus.or .disque{border:2px solid var(--encre);color:var(--encre)}
.med.bonus.bronze .disque{background:var(--bronze)}
.med.bonus.argent .disque{background:var(--argent)}
.med.bonus.or .disque{background:var(--or)}
/* Le platine : ruban rayé et double cerclage, pour ne pas le confondre avec l'argent */
.med.bonus.platine .ruban,.bravo .med.bonus.platine .ruban{background:linear-gradient(90deg,var(--encre) 0%,var(--encre) 34%,#FFFFFF 34%,#FFFFFF 66%,var(--encre) 66%,var(--encre) 100%)}
.med.bonus.platine .disque{border:2px solid var(--encre);background:var(--platine);color:var(--encre);box-shadow:inset 0 0 0 3px #FFFFFF,inset 0 0 0 4.5px var(--encre)}

/* Accueil : le dossard, la séance du jour et le porte-médailles tiennent ensemble sur l'écran du téléphone.
   --h : la hauteur d'écran au-delà de 640 px (220 px au plus). Le dossard et les marges grandissent avec elle ;
   sur un écran court, tout se resserre pour que le porte-médailles reste visible sans faire défiler. */
[data-vue="objectif"]{--h:clamp(0px,100vh - 640px,220px);--num-max:128px;--num:min(var(--num-max),72px + var(--h)*.255)}
@supports (height:100svh){[data-vue="objectif"]{--h:clamp(0px,100svh - 640px,220px)}}
[data-vue="objectif"] .bandeau{padding:calc(10px + var(--h)*.0545) 20px calc(10px + var(--h)*.0455);gap:calc(8px + var(--h)*.018)}
[data-vue="objectif"] .dossard{margin:calc(2px + var(--h)*.018) 0 calc(6px + var(--h)*.018)}
[data-vue="objectif"] .dossard-haut{min-height:calc(28px + var(--h)*.027);padding:4px 26px;font-size:calc(14px + var(--h)*.0045)}
[data-vue="objectif"] .dossard-num{gap:calc(6px + var(--h)*.009);padding:calc(8px + var(--h)*.009) 12px calc(4px + var(--h)*.009)}
[data-vue="objectif"] .dossard-num .num{font-size:var(--num)}
[data-vue="objectif"] .dossard-num .num.m{font-size:calc(var(--num)*.845)}
[data-vue="objectif"] .dossard-num .num.l{font-size:calc(var(--num)*.72)}
[data-vue="objectif"] .dossard-num .unite{font-size:calc(var(--num)*.3125)}
[data-vue="objectif"] .dossard-num .unite.d{font-size:calc(var(--num)*.235)}
[data-vue="objectif"] .dossard-bas{min-height:calc(38px + var(--h)*.036);padding:calc(4px + var(--h)*.009) 28px}
[data-vue="objectif"] .dossard-bas .nom{font-size:calc(24px + var(--h)*.018)}
[data-vue="objectif"] .jmoins{font-size:calc(18px + var(--h)*.009);line-height:calc(22px + var(--h)*.009)}
[data-vue="objectif"] .trou.a,[data-vue="objectif"] .trou.b{top:calc(9px + var(--h)*.0135)}
[data-vue="objectif"] .trou.c,[data-vue="objectif"] .trou.e{bottom:calc(14px + var(--h)*.018)}
[data-vue="objectif"] .prepa{gap:calc(4px + var(--h)*.009)}
[data-vue="objectif"] .bloc{padding-top:calc(12px + var(--h)*.036);gap:calc(12px + var(--h)*.009)}
[data-vue="objectif"] .carte{gap:6px}
[data-vue="objectif"] .titre-seance{font-size:30px;line-height:32px}
[data-vue="objectif"] .faits{margin-top:0}
[data-vue="objectif"] .fait{border-top-width:2px;padding-top:3px}
[data-vue="objectif"] .fait b{font-size:24px;line-height:26px}
[data-vue="objectif"] .ratelier{gap:6px;margin-top:calc(var(--h)*.036)}
[data-vue="objectif"] .ruban{height:calc(18px + var(--h)*.027)}
/* La signature de l'auteur, sous le porte-médailles */
.credit{margin-top:-4px;text-align:center;font:600 12px/16px var(--titre);letter-spacing:.12em;text-transform:uppercase;color:var(--gris)}
/* Deux boutons sur une ligne : l'action principale prend la place, la seconde reste à sa largeur */
.actions.paire{flex-wrap:nowrap;margin-top:4px}
.actions.paire>.btn{flex:1 1 auto;min-height:48px;white-space:nowrap}
.actions.paire>.btn.sec{flex:0 0 auto;padding:0 16px}
@media (max-width:340px){.actions.paire>.btn{padding:0 10px;font-size:18px;letter-spacing:.06em}.actions.paire>.btn.sec{padding:0 12px}}

/* Plan */
details.sem{border-top:2px solid var(--encre)}
details.sem>summary{list-style:none;cursor:pointer;min-height:58px;padding:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.sem>summary::-webkit-details-marker{display:none}
.sem-g{display:flex;flex-direction:column;gap:1px;min-width:0}
.sem-titre{font:800 22px/24px var(--titre);letter-spacing:.02em;text-transform:uppercase}
.sem-dates{font-size:13px;line-height:17px;color:var(--gris)}
.sem-d{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.puce{font:700 12px/18px var(--titre);letter-spacing:.08em;text-transform:uppercase;padding:0 7px;border:1.5px solid var(--encre);border-radius:3px;white-space:nowrap}
.puce.ici{background:var(--orange);border-color:var(--orange)}
.compte{font:800 18px/20px var(--titre);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.ligne{width:100%;min-height:56px;padding:6px 0;border:0;border-top:1px solid var(--trait);background:none;text-align:left;cursor:pointer;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:0 8px}
.pastille{width:26px;height:26px;border-radius:50%;border:2px solid var(--encre);display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--titre)}
.pastille.ok{background:var(--encre);color:#FFFFFF}
.l-g{display:flex;flex-direction:column;gap:1px;min-width:0}
.l-titre{font-size:16px;line-height:20px;font-weight:600}
.l-info{font-size:13px;line-height:17px;color:var(--gris)}
.chevron{font:700 22px/1 var(--titre);color:var(--gris)}
.actions-sem{display:flex;flex-wrap:wrap;gap:0 18px;border-top:1px solid var(--trait)}
details.sem>.aide{padding:0 0 12px}

.liste>li{border-top:1px solid var(--trait);padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.liste>li:last-child{border-bottom:1px solid var(--trait)}
.l-date{font:700 13px/16px var(--titre);letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.conf{display:flex;align-items:center;gap:12px;flex:none}
.liste.serree>li{padding:0}
.ligne.sortie{border-top:0;grid-template-columns:minmax(0,1fr) auto;min-height:60px;padding:9px 0}

/* Carnet : calendrier du mois. Le ressenti suit une seule teinte, du clair (facile) au foncé (dur). */
.mois{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mois .rond{margin:0;border:2px solid var(--encre)}
.mois .rond:disabled{border-color:var(--trait);color:#9A9D98;cursor:default}
.mois-nom{font:800 26px/28px var(--titre);letter-spacing:.02em;text-transform:uppercase}
.cal{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;margin:-3px}
.cal th{padding:0 0 3px;font:700 13px/16px var(--titre);letter-spacing:.08em;color:var(--gris);text-align:center}
.cal th abbr{text-decoration:none}
.cal td{padding:0}
.cal button,.cal .case{width:100%;height:52px;padding:4px 5px 5px;border:0;border-radius:6px;background:#E8E9E4;color:var(--encre);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left}
.cal button{cursor:pointer}
.cal .case{background:transparent;color:#6B6F6A}
.cal .j{font-size:12px;line-height:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cal .haut{width:100%;display:flex;align-items:baseline;justify-content:space-between;gap:2px}
.cal .dp{font-size:10.5px;line-height:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cal .v{align-self:flex-end;font:800 17px/17px var(--titre);font-variant-numeric:tabular-nums;white-space:nowrap}
.cal .v small{font-size:11px;font-weight:700;margin-left:2px}
.cal .facile{background:#B5C9E7}
.cal .correct{background:var(--bleu);color:#FFFFFF}
.cal .dur{background:#10264A;color:#FFFFFF}
.cal .auj{box-shadow:inset 0 0 0 2px var(--encre)}
.cal .correct.auj,.cal .dur.auj{box-shadow:inset 0 0 0 2px var(--encre),inset 0 0 0 4px #FFFFFF}
.cal .jj{box-shadow:inset 0 0 0 2px var(--orange)}
.cal .case.jj{color:var(--encre)}
.legende.cal-leg i{width:12px;height:12px;border:0;border-radius:3px}
.legende.cal-leg i.facile{background:#B5C9E7}
.legende.cal-leg i.correct{background:var(--bleu)}
.legende.cal-leg i.dur{background:#10264A}

/* Formulaires */
.champ{display:flex;flex-direction:column;gap:6px}
.champ>label:not(.choix),.champ>legend{font:600 13px/16px var(--titre);letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.champ>legend{margin-bottom:6px}
input[type=text],input[type=date],textarea{width:100%;min-height:48px;padding:8px 12px;border:2px solid var(--encre);border-radius:8px;background:#FFFFFF;font-size:16px}
::placeholder{color:#8A8D88;font-weight:500;opacity:1}
textarea{min-height:96px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:16px}
input.grand{min-height:52px;font:800 26px var(--titre)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choix{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:9px 0;cursor:pointer;font-size:15px;line-height:20px}
.choix input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--bleu)}
.choix small{display:block;font-size:13px;line-height:17px;color:var(--gris)}
.en-ligne{display:flex;align-items:stretch;gap:8px}
.en-ligne>input{flex:1;min-width:0}
.en-ligne>.btn{flex:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg label{position:relative;display:flex;cursor:pointer}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{flex:1;min-height:48px;border:2px solid var(--encre);border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 17px var(--titre);letter-spacing:.08em;text-transform:uppercase}
.seg input:checked+span{background:var(--encre);color:#FFFFFF}
.seg input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}

/* Routine */
.exo{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:0 8px;min-height:56px;border-top:1px solid var(--trait);cursor:pointer}
.exo input{width:22px;height:22px;margin:0;accent-color:var(--bleu)}
.exo-nom{font-size:16px;line-height:20px;font-weight:600;overflow-wrap:anywhere}
.exo-dose{font:800 22px/24px var(--titre);letter-spacing:.02em;white-space:nowrap}
.exos{border-bottom:1px solid var(--trait)}
.exo-edit{border-top:1px solid var(--trait);padding:12px 0 2px;display:flex;flex-direction:column;gap:2px}
.pointille{min-height:48px;border:1.5px dashed #9A9D98;border-radius:8px;background:transparent;font-size:15px;font-weight:600;cursor:pointer}

/* Poids */
.gros-poids{display:flex;align-items:baseline;gap:8px;font-family:var(--titre);font-weight:800}
.gros-poids .num{font-size:96px;line-height:.9}
.gros-poids .unite{font-size:34px;line-height:1}
/* Page Suivi : la dernière pesée et la dernière nuit, côte à côte dans le bandeau */
.deux-gros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.deux-gros .gros-poids{gap:6px}

/* Ouverture : l'écran bleu du lancement. Le dossard y tombe et se pose, puis l'écran s'efface sur l'accueil.
   Il ne retient aucun geste, et s'efface de lui-même au bout de 5 s si rien ne vient le lancer. */
.ouverture{position:fixed;inset:0;z-index:50;background:var(--bleu);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px 20px 12vh;pointer-events:none;animation:ouv-secours .4s 5s both}

.ouverture.file{animation:ouv-fin .35s both}
/* Sur l'accueil : le fond bleu s'efface pendant que le dossard glisse à sa place, où l'attend celui de l'écran */
.ouverture.range{animation:ouv-voile .5s 2s both}
.ouverture.range>.sur{animation:ouv-fin .3s 1.95s both}
.ouverture.range .dossard{animation:ouv-dossard .85s cubic-bezier(.2,.9,.3,1.2) .25s both,ouv-range .5s cubic-bezier(.5,0,.2,1) 2s forwards}

@keyframes ouv-fin{to{opacity:0;visibility:hidden}}

<script>
// Version autonome : l'appli enregistre les données dans le navigateur de l'appareil.
window.DOSSARD_AUTONOME = true;

<script>
/* Le Dossard : logique pure (dates, programme, médailles, carnet, routine, poids). Aucun accès à la page. */
(function (root) {
  'use strict';

  // ---------- Dates (chaînes AAAA-MM-JJ, heure locale) ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateDe(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dateValide(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false;
    return iso(dateDe(s)) === s;
  }
  function plusJours(s, n) { var d = dateDe(s); d.setDate(d.getDate() + n); return iso(d); }
  function ecartJours(a, b) {
    var da = dateDe(a), db = dateDe(b);
    return Math.round((Date.UTC(db.getFullYear(), db.getMonth(), db.getDate()) -
      Date.UTC(da.getFullYear(), da.getMonth(), da.getDate())) / 86400000);
  }
  function prochainLundi(s) { var d = dateDe(s); return plusJours(s, (8 - d.getDay()) % 7); }

  // ---------- Formats ----------
  function fx(v, dec) {
    var s = dec != null ? Number(v).toFixed(dec) : String(Math.round(Number(v) * 10) / 10);
    return s.replace('.', ',');
  }
  function mil(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0'); }
  function minTxt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m && s) return m + ' min ' + pad(s);
    if (m) return m + ' min';
    return s + ' s';
  }
  function nombre(txt) {
    var t = String(txt == null ? '' : txt).trim().replace(/\s/g, '').replace(',', '.');
    if (!/^\d+(\.\d+)?$/.test(t)) return null;
    return Number(t);
  }

  // ---------- Séances ----------
  function E(t, s, l) { return { t: t, s: s, l: l }; }
  function total(etapes) { var t = 0; etapes.forEach(function (e) { t += e.s; }); return t; }
  function seance(type, titre, resume, etapes, extra) {
    var o = {
      type: type, titre: titre, resume: resume, etapes: etapes || [],
      min: etapes && etapes.length ? Math.round(total(etapes) / 60) : null,
      km: null, dp: null, conseil: '', test: null
    };
    if (extra) Object.keys(extra).forEach(function (k) { o[k] = extra[k]; });
    return o;
  }
  var PARLER = 'Cours à une allure où tu peux parler sans t’essouffler.';

  function alt(n, c, m) {
    var et = [E('marche', 300, 'Marche rapide')];
    for (var i = 0; i < n; i++) {
      et.push(E('course', c, 'Course lente ' + (i + 1) + '/' + n));
      if (i < n - 1) et.push(E('marche', m, 'Marche'));

    et.push(E('marche', 300, 'Marche pour finir'));
    return seance('alt', 'Marche et course',
      '5 min de marche rapide, puis ' + n + ' × ' + minTxt(c) + ' de course lente avec ' + minTxt(m) +
      ' de marche entre chaque, et 5 min de marche pour finir.', et, { conseil: PARLER });
  }
  function suite(parts) {
    var et = [E('marche', 300, 'Marche rapide')], txt = [];

  function lireDate(v, idErr, futurePermise) {
    if (!D.dateValide(v)) { erreur(idErr, 'Choisis une date valide.'); return null; }
    if (!futurePermise && v > auj()) { erreur(idErr, 'Cette date est dans le futur : choisis aujourd’hui ou un jour passé.'); return null; }
    return v;
  }
  var FORMS = {
    'demarrer': function (f) {
      var prenom = f.prenom.value.trim(), niv = f.niveau.value, debut = f.debut.value, dep = 0;
      if (!prenom) { erreur('ob-erreur', 'Écris ton prénom : il s’affiche sur le dossard.'); f.prenom.focus(); return; }
      if (!D.dateValide(debut)) { erreur('ob-erreur', 'Choisis la date de ta première semaine.'); f.debut.focus(); return; }
      D.DEPARTS.forEach(function (d) { if (d.id === niv) dep = d.depart; });
      var but = D.BUTS.dist.indexOf(f.dist.value) >= 0 ? { dist: f.dist.value, deniv: D.BUTS.deniv.indexOf(f.deniv.value) >= 0 ? f.deniv.value : null } : D.lireBut(null);
      var ry = D.lireRythme({ rythme: f.rythme.value });
      if (ry === 'rapide' && !D.rapidePermis({ niveau: niv })) ry = 'regulier';
      S.docs.profil = { v: 1, prenom: prenom, cree: auj(), feuVert: null, medailles: {}, passes: [], nbBlocs: 1, but: but, rythme: ry, niveau: niv, bloc: D.nouveauBloc('5k', debut, dep, 'b1', ry) };
      if (!S.docs.routine) S.docs.routine = D.routineDefaut();
      garder('profil', 'routine'); allerA('objectif'); dire('Ton programme est créé.');
    },
    'sortie': function (f) {
      var s = seanceCourante() || LIBRE, anc = sortieCourante(), p = P(), jn = Jn();
      var d = lireDate(f.date.value, 'so-erreur'); if (!d) { f.date.focus(); return; }
      var tMin = f.min.value.trim(), tKm = f.km.value.trim(), tDp = f.dp.value.trim();
      var min = tMin ? D.nombre(tMin) : null, km = tKm ? D.nombre(tKm) : null, dp = tDp ? D.nombre(tDp) : null;
      if (tKm && (km == null || km > 300)) { erreur('so-erreur', 'La distance se note en kilomètres. Exemple : 4,6.'); f.km.focus(); return; }
      if (tDp && (dp == null || dp > 15000)) { erreur('so-erreur', 'Le dénivelé se note en mètres, sans décimale. Exemple : 90.'); f.dp.focus(); return; }
      if (tMin && (min == null || min < 1 || min > 1440)) { erreur('so-erreur', 'La durée se note en minutes, entre 1 et 1440. Exemple : 35.'); f.min.focus(); return; }
      if (!km && !min) { erreur('so-erreur', 'Note au moins la distance ou la durée.'); f.km.focus(); return; }
      var libre = !!(S.f.libre || S.f.id);
      var ref = anc ? (anc.ref || null) : (libre ? null : { w: S.f.sem, i: S.f.i }), titre = anc ? titreSortie(anc) : s.titre;
      if (!anc && libre && f.plan && f.plan.checked) {
        var cible = D.seanceAFaire(p.bloc, jn, d);
        if (cible) { ref = { w: cible.w, i: cible.i }; titre = cible.s.titre; }
      }
      var x = { id: anc ? anc.id : 'o' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36), d: d,
        min: min ? Math.round(min) : null, km: km ? Math.round(km * 100) / 100 : null, dp: dp ? Math.round(dp) : null,
        cont: f.cont ? !!f.cont.checked : !!(anc && anc.cont), res: f.res.value || 'correct', note: f.note.value.trim().slice(0, 120), titre: titre, ref: ref };
      if (f.rando ? f.rando.checked : (anc && anc.rando)) x.rando = true;
      // Une sortie libre notée comme randonnée en porte le nom dans le carnet
      if (!x.ref && (x.titre === LIBRE.titre || x.titre === 'Randonnée')) x.titre = x.rando ? 'Randonnée' : LIBRE.titre;
      jn.sorties = jn.sorties.filter(function (y) { return y.id !== x.id; }); jn.sorties.push(x);
      if (route() === 'carnet') S.ui.mois = d.slice(0, 7);
      var gagnees = D.nouvellesMedailles({ km: x.km || 0, dp: x.dp || 0, cont: x.cont }, p.medailles || {}, idsParcours());
      if (gagnees.length) {
        p.medailles = p.medailles || {};
        gagnees.forEach(function (id) { p.medailles[id] = d; });
        if (p.bloc && p.medailles[p.bloc.obj]) { p.passes = p.passes || []; p.passes.push({ obj: p.bloc.obj, debut: p.bloc.debut, fin: d }); p.bloc = null; }
        garder('profil');
      }
      garder('journal');
      var bs = majBonus();
      if (gagnees.length || bs.length) { S.f = { type: 'seance', mode: 'bravo', gagnees: gagnees, bonus: bs }; rendreFeuille(true); rendre(); return; }
      fermerFeuille(); dire(anc ? 'Sortie corrigée.' : 'Sortie enregistrée.');
    },
    'pesee': function (f) {
      // La pesée, le score de sommeil, ou les deux, pour une même date.
      var d = lireDate(f.date.value, 'pe-erreur'); if (!d) { f.date.focus(); return; }
      var tk = f.kg.value.trim(), tn = f.nuit.value.trim(), kg = null, nuit = null;
      if (!tk && !tn) { erreur('pe-erreur', 'Écris ta pesée, ton score de sommeil, ou les deux.'); f.kg.focus(); return; }
      if (tk) { kg = D.nombre(tk); if (kg == null || kg < 25 || kg > 300) { erreur('pe-erreur', 'Écris ton poids en kilos, par exemple 80,4.'); f.kg.focus(); return; } }
      if (tn) { nuit = D.nombre(tn); if (nuit == null || nuit > 100 || Math.round(nuit) !== nuit) { erreur('pe-erreur', 'Le score de sommeil est un nombre entier entre 0 et 100.'); f.nuit.focus(); return; } }
      var pd = Pd();
      if (kg != null) pd.mesures[d] = Math.round(kg * 10) / 10;
      if (nuit != null) { if (!pd.nuits) pd.nuits = {}; pd.nuits[d] = nuit; }
      garder('poids'); S.ui.sel = null;
      // Une médaille du sommeil ou du poids vient d'être décrochée : on la fête. Les autres, s'il y en a en attente, sont simplement annoncées.
      var bs = majBonus(), fete = bs.filter(function (k) { return /^(loir|sac)-/.test(k); }); rendre();
      if (fete.length) { dire(''); ouvrirFeuille({ type: 'seance', mode: 'bravo', gagnees: [], bonus: fete.concat(bs.filter(function (k) { return fete.indexOf(k) < 0; })) }); return; }
      dire((kg != null && nuit != null ? 'Pesée et score de sommeil du ' + dCourt(d) + ' enregistrés.' : kg != null ? 'Pesée du ' + dCourt(d) + ' enregistrée.' : 'Score de sommeil du ' + dCourt(d) + ' enregistré.') +
        (bs.length ? ' ' + (bs.length > 1 ? 'Médailles bonus : ' : 'Médaille bonus : ') + bs.map(nomCle).join(', ') + '.' : ''));
    },
    'exo-ajout': function (f) {
      var nom = f.nom.value.trim(), dose = f.dose.value.trim(), rt = Rt();
      if (!nom) { erreur('ea-erreur', 'Donne un nom à l’exercice.'); f.nom.focus(); return; }
      rt.n = (rt.n || rt.exos.length) + 1;
      rt.exos.push({ id: 'e' + rt.n, nom: nom.slice(0, 40), dose: dose.slice(0, 20) });
      garder('routine'); rendre(); var z = document.getElementById('ea-nom'); if (z) z.focus();
    },
    'lancer-bloc': function (f) {
      var p = P(), id = S.f.obj, debut = f.debut.value, dep = 0;
      if (!D.dateValide(debut)) { erreur('ch-erreur', 'Choisis la date de ta première semaine.'); f.debut.focus(); return; }
      if (id === '5k' && f.niveau) D.DEPARTS.forEach(function (d) { if (d.id === f.niveau.value) dep = d.depart; });
      if (p.bloc) { p.passes = p.passes || []; p.passes.push({ obj: p.bloc.obj, debut: p.bloc.debut, fin: auj(), arret: true }); }
      p.bloc = D.nouveauBloc(id, debut, dep, cleBloc(p), D.lireRythme(p)); S.ui.ouv = {};
      garder('profil'); fermerFeuille(true); allerA('objectif');
      dire('Nouvel objectif : ' + D.objectif(id).nom + '.');
    },
    'objectif': function (f) {
      var p = P(), but = { dist: f.dist.value, deniv: f.deniv.value || null }, med = p.medailles || {};
      if (D.BUTS.dist.indexOf(but.dist) < 0) return;
      var ids = D.etapes(but).map(function (o) { return o.id; });
      var hors = Object.keys(med).concat(p.bloc ? [p.bloc.obj] : []).filter(function (id, k, l) { return ids.indexOf(id) < 0 && l.indexOf(id) === k; });
      if (hors.length) { erreur('rg-erreur', 'Ce parcours laisserait de côté ' + hors.map(function (id) { return D.objectif(id).nom; }).join(' et ') + ', que tu as déjà décroché ou que tu prépares. Choisis un objectif qui le contient.'); return; }
      p.but = but; p.medailles = med;
      var rat = D.rattraper(Jn().sorties, ids, med); Object.keys(rat).forEach(function (id) { med[id] = rat[id]; });
      garder('profil'); rendre(); rendreFeuille(); dire('Objectif : ' + D.nomBut(but) + '.');
    },
    'rythme': function (f) {
      var p = P(), r = D.lireRythme({ rythme: f.rythme.value }), nom = '';
      if (r === 'rapide' && !D.rapidePermis(p)) { erreur('rg-erreur', 'Le rythme rapide s’ouvre une fois les 5 km décrochés.'); return; }
      D.RYTHMES.forEach(function (x) { if (x.id === r) nom = x.nom.toLowerCase(); });
      p.rythme = r;
      if (p.bloc) { var pos = D.position(p.bloc, auj()); D.changerRythme(p.bloc, pos.etat === 'avant' ? -1 : (pos.etat === 'apres' ? p.bloc.semaines.length - 1 : pos.k), r); S.ui.ouv = {}; }
      garder('profil'); rendre(); rendreFeuille();
      dire('Rythme ' + nom + (p.bloc ? ' : jour J le ' + dCourt(D.position(p.bloc, auj()).jourJ) + '.' : '.'));
    },
    'prenom': function (f) {
      var v = f.prenom.value.trim();
      if (!v) { erreur('rg-erreur', 'Le prénom ne peut pas rester vide.'); f.prenom.focus(); return; }
      P().prenom = v.slice(0, 20); garder('profil'); erreur('rg-erreur', ''); rendre(); dire('Prénom mis à jour.');
    },
    'debut': function (f) {
      var v = f.debut.value;
      if (!D.dateValide(v)) { erreur('rg-erreur', 'Choisis une date valide pour la première semaine.'); f.debut.focus(); return; }
      P().bloc.debut = v; garder('profil'); erreur('rg-erreur', ''); rendre(); dire('Le plan démarre maintenant ' + dLong(v) + '.');
    },
    'importer': function (f) {
      var o = null;
      try { o = JSON.parse(f.texte.value); } catch (e) { o = null; }
      if (!o || o.app !== 'le-dossard' || !o.profil || typeof o.profil.prenom !== 'string') { erreur('rg-erreur', 'Ce texte n’est pas une copie du Dossard. Colle la copie entière, sans la modifier.'); f.texte.focus(); return; }
      if (!f.ok.checked) { erreur('rg-erreur', 'Coche la case pour confirmer le remplacement de tes données.'); f.ok.focus(); return; }
      S.docs.profil = o.profil;
      S.docs.journal = (o.journal && Array.isArray(o.journal.sorties)) ? o.journal : { sorties: [] };
      S.docs.routine = (o.routine && Array.isArray(o.routine.exos)) ? o.routine : D.routineDefaut();
      S.docs.poids = (o.poids && o.poids.mesures && typeof o.poids.mesures === 'object') ? o.poids : { mesures: {} };
      if (S.docs.poids.nuits != null && typeof S.docs.poids.nuits !== 'object') delete S.docs.poids.nuits;
      garder('profil', 'journal', 'routine', 'poids'); fermerFeuille(); dire('Copie restaurée.');
    },
    'effacer': function (f) {
      if (f.mot.value.trim() !== 'EFFACER') { erreur('rg-erreur', 'Écris EFFACER en majuscules pour confirmer.'); f.mot.focus(); return; }
      S.docs.profil = null; S.docs.journal = { sorties: [] }; S.docs.routine = D.routineDefaut(); S.docs.poids = { mesures: {} };
      S.ui = { plage: 28, ouv: {}, suppr: null, edit: false, sel: null, mois: null };
      garder('profil', 'journal', 'routine', 'poids'); fermerFeuille(); window.scrollTo(0, 0); dire('Tout est effacé.');
    }
  };
  var CHANGES = {
    'creation': function (el) { majCreation(el); },
    'exo': function (el) {
      var rt = Rt(), tout = D.basculer(rt, auj(), el.getAttribute('data-id'), el.checked);
      garder('routine'); rendre();
      var bs = tout ? majBonus() : [];
      if (bs.length) direBonus(bs);
      else if (tout) dire('Routine complète. ' + D.serie(rt, auj()) + (D.serie(rt, auj()) > 1 ? ' matins d’affilée.' : ' matin au compteur.'));
    },
    'exo-nom': function (el) { majExo(el, 'nom', 40); },
    'exo-dose': function (el) { majExo(el, 'dose', 20); }
  };
  function majExo(el, champ, max) {
    var id = el.getAttribute('data-id'), v = el.value.trim().slice(0, max);
    Rt().exos.forEach(function (e) { if (e.id === id) { if (champ === 'nom' && !v) { el.value = e.nom; return; } e[champ] = v; } });
    garder('routine');
  }

  // ---------- Écoute ----------
  document.addEventListener('click', function (ev) {
    if (ev.target === feuille && S.f) { fermerFeuille(); return; }
    var el = ev.target.closest('[data-a]'); if (!el) return;
    var fn = ACTIONS[el.getAttribute('data-a')]; if (fn) fn(el, ev);
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target.closest('form[data-f]'); if (!f) return;
    ev.preventDefault();
    var fn = FORMS[f.getAttribute('data-f')]; if (fn) fn(f);
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target.closest('[data-c]'); if (!el) return;
    var fn = CHANGES[el.getAttribute('data-c')]; if (fn) fn(el);
  });
  document.addEventListener('input', function (ev) {
    var f = ev.target.closest && ev.target.closest('form[data-f]'), e = f && f.querySelector('.erreur');
    if (e && !e.hidden) { e.hidden = true; e.textContent = ''; }
  });
  document.addEventListener('focusout', function () { if (S.aRendre) setTimeout(function () { if (S.aRendre) rendreFond(); }, 0); });
  document.addEventListener('toggle', function (ev) {
    var d = ev.target; if (d && d.matches && d.matches('details.sem')) S.ui.ouv[d.getAttribute('data-sem')] = d.open;
  }, true);
  document.addEventListener('pointermove', pointeCourbe);
  document.addEventListener('pointerdown', pointeCourbe);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.f) { fermerFeuille(); return; }
    var idc = ev.target && ev.target.id, cc = idc && COURBES[idc] && (S.ui.courbes || {})[idc];
    if ((ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && cc) {
      ev.preventDefault();
      var sel = (S.ui.sel || {})[idc], i = sel == null ? cc.pts.length - 1 : sel;
      selCourbe(i + (ev.key === 'ArrowLeft' ? -1 : 1), idc);
    }
  });
  window.addEventListener('hashchange', function () {
    S.ui.suppr = null; S.ui.sel = null; S.ui.edit = false; S.ui.mois = null;
    rendre(); haut();
    try { vue.focus({ preventScroll: true }); } catch (e) {}
  });

  rendre();
  Depot.ouvrir();
})();
</script>
